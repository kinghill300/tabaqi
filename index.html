<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5c3f">
<title>طبقي – نظام أكل</title>

<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* VOICE: صاحبك اللي فاهم في الأكل، عملي ومن غير رغي
   IDEA: لافتة عربية الفول + الطبق المقسوم
   PICTURE: طبق مقسوم على الوجبات وفي نصه السعرات
   COLOUR and TYPE: أخضر ملوخية، لون العيش، أحمر طماطم؛ Lalezar للعناوين والأرقام، Readex Pro للنص
   LAYOUT: عمود واحد للموبايل بحد أقصى ٧٢٠، وبلوك أخضر فوق */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1a14);--ink:light-dark(#17261d,#eef3ee);--muted:light-dark(#566a5e,#a6b7ab);
--green:light-dark(#1f5c3f,#173f2c);--leaf:light-dark(#2f8f5b,#5fbf8a);
--bread:light-dark(#f4e3bd,#3a301d);--bread-ink:light-dark(#5a4214,#f1dcae);
--tomato:light-dark(#d93a26,#ff6a55);--card:light-dark(#f5f7f4,#16241c);--line:light-dark(#e1e7e2,#26382d);
--plate:light-dark(#ffffff,#1d2c23);--plate2:light-dark(#f1f4f0,#24362b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Readex Pro",Tahoma,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big,.sign{font-family:Lalezar,"Readex Pro",Tahoma,sans-serif;font-weight:400;line-height:1.1;margin:0}
html[lang=en] h1,html[lang=en] h2,html[lang=en] .big,html[lang=en] .sign{font-family:"Readex Pro",system-ui,sans-serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(36px,9vw,52px);text-wrap:balance}h2{font-size:24px}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 max(4vw,16px)}
.band{background:var(--green);color:#fff;padding:14px 0 30px}
.band p{opacity:.9}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}
.top .logo{font-family:Lalezar,"Readex Pro",sans-serif;font-size:24px}
.top .acts{display:flex;gap:6px}
.ico{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;font-weight:600;padding:0 10px}
button,input,select{font:inherit;color:inherit}
.btn{min-height:48px;border:0;border-radius:14px;padding:10px 18px;cursor:pointer;font-weight:600;background:var(--tomato);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:44px;padding:8px 14px;font-size:15px}
.band .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.choices{display:grid;gap:14px;margin-top:24px}
.choice{display:block;width:100%;text-align:start;border:0;border-radius:20px;padding:20px;cursor:pointer;background:var(--bread);color:var(--bread-ink)}
.choice .sign{font-size:28px;display:block;margin-bottom:4px}
.choice.alt{background:rgba(255,255,255,.12);color:#fff}
.form{display:grid;gap:18px;padding:24px 0 40px}
label.f,.f{display:grid;gap:6px;font-weight:500}
.f input,.f select{min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);font-size:16px;width:100%}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:44px;flex:1 1 auto;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.hint{font-size:14px;color:var(--muted)}
.err{color:var(--tomato);font-weight:500;min-height:1.4em}
.res{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:16px;align-items:center}
.res .big{font-size:clamp(54px,15vw,80px)}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:15px}
.stats b{font-weight:600}
.plate{width:180px;height:180px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.tools{padding:20px 0 6px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .rec{font-size:12px;background:var(--tomato);color:#fff;border-radius:6px;padding:0 6px;margin-inline-start:6px}
.diet{background:var(--card);border-radius:16px;padding:14px;display:grid;gap:10px}
.meal{border-top:1.5px solid var(--line);padding:18px 0}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mh h2 .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:8px;vertical-align:middle}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin:10px 0}
.tabs button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-size:15px}
.tabs button[aria-pressed=true]{background:var(--bg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mname{font-weight:600;font-size:18px;margin:6px 0 8px}
.lbl{font-size:14px;color:var(--muted);margin:8px 0 6px}
.items{list-style:none;margin:8px 0 0;padding:0;background:var(--card);border-radius:14px}
.items li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.items .q{white-space:nowrap;font-weight:600;text-align:end}
.items .q small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.k{color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted);margin-top:6px}
.total{position:sticky;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar{height:10px;border-radius:99px;background:var(--card);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--leaf);transition:width .4s}
.tl{display:flex;justify-content:space-between;gap:4px 12px;font-size:15px;flex-wrap:wrap}
.tips{padding:24px 0;display:grid;gap:8px}
.tips ul{margin:0;padding-inline-start:20px}
footer{font-size:13px;color:var(--muted);padding:20px 0 40px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(4vw,16px) 28px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 4px;cursor:pointer;min-height:52px}
.opt>span:last-child{color:var(--muted);white-space:nowrap;font-size:14px}
.tag{font-size:12px;background:var(--bread);color:var(--bread-ink);border-radius:6px;padding:1px 6px;margin-inline-start:6px;white-space:nowrap}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:10}
textarea{width:100%;min-height:160px;border-radius:12px;border:1.5px solid var(--line);padding:10px;font:inherit;background:var(--card)}
.logrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.logrow .k{flex-basis:100%}
.logged{background:var(--card);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal button{aspect-ratio:1;border:0;border-radius:10px;cursor:pointer;font-size:14px;background:var(--card);color:var(--ink);min-height:40px}
.cal .good{background:var(--leaf);color:#fff}.cal .mid{background:#f0b429;color:#3a2a00}.cal .off{background:var(--tomato);color:#fff}.cal .low{background:#8fb3a0;color:#fff}
.cal .today{outline:2px solid var(--ink);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.kpis div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px}
.kpis .big{font-size:clamp(30px,8vw,42px)}
.spark{width:100%;height:120px;display:block}
.dayrow{border-bottom:1px solid var(--line);padding:12px 0}
@media(max-width:520px){.res{grid-template-columns:minmax(0,1fr) 120px}.plate{width:120px;height:120px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.fresh .items{animation:pop .3s ease}
</style>
</head>

function build(m,target){const b=macro(m),fx=m[4].filter(x=>x[2]).reduce((a,[id,q])=>a+F[id][4]*q,0);
 const k=Math.min(2.2,Math.max(.5,(target-fx)/(b.k-fx||1)));let o={items:[],k:0,p:0,c:0};
 m[4].forEach(([id,q,f])=>{const st=stepOf(id,q*k);const qq=f?q:Math.max(st,Math.round(q*k/st)*st);add(o,id,qq)});return o}
function add(o,id,qq){const f=F[id];o.k+=f[4]*qq;o.p+=f[5]*qq;o.c+=f[6]*qq;o.items.push(line(id,qq))}
function compose(x){const K=S.kcal*share(x),P=S.prot*share(x)*(S.diet==='high'?1.05:1);const bm=S.bm[x]||{};const plist=protList(x);
 const pid=plist.includes(bm.p)?bm.p:plist[0],cid=bm.c&&(bm.c==='none'||BC[x].includes(bm.c))?bm.c:(S.diet==='low'&&x!=='b'?'none':BC[x][0]);const o={items:[],k:0,p:0,c:0,pid,cid};
 if(!pid)return o;const pf=F[pid];let q=(P*.8)/pf[5];q=Math.min(q,K*.65/pf[4]);
 if(pid==='egg')q=Math.min(q,4);if(pid==='greek')q=Math.min(q,2);if(pid==='qareesh')q=Math.min(q,250);if(pid==='tuna')q=Math.min(q,2);
 const st=U[pf[2]][3];q=Math.max(st,Math.round(q/st)*st);add(o,pid,q);
 if(x==='b')add(o,'cuc',1);else{add(o,'salad',1);if(x==='l')add(o,'veg',1)}
 if(x!=='b'&&LEAN.includes(pid))add(o,'oil',1);if(S.diet==='low'&&x!=='b')add(o,'tahina',1);
 if(cid!=='none'){const cf=F[cid];let rem=K-o.k;if(rem>50){let cq=rem/cf[4];if(S.diet==='low')cq=Math.min(cq,(110*share(x))/cf[6]);const cs=stepOf(cid,cq);cq=Math.max(cs,Math.round(cq/cs)*cs);add(o,cid,cq)}}
 return o}
function protList(x){return(BP[x]||[]).filter(id=>{const g=(F[id][7]||'').split(' ');if(S.diet==='veg'&&g.some(z=>['meat','poultry','fish'].includes(z)))return false;return!g.some(z=>S.ex.includes(z))})}
function okDiet(m){const g=tagsOf(m),b=macro(m),sn=m[0]==='s';
 if(S.diet==='veg'&&g.some(z=>['meat','poultry','fish'].includes(z)))return false;if(S.diet==='med'&&g.includes('proc'))return false;
 if(S.diet==='low'&&b.c*4/b.k>(sn?.5:.4))return false;if(S.diet==='high'&&b.p*4/b.k<(sn?.12:.22))return false;return true}
function pool(x){const base=M.map((m,i)=>[m,i]).filter(([m])=>m[0]===x&&(!S.out||m[3])&&!tagsOf(m).some(g=>S.ex.includes(g)));const d=base.filter(([m])=>okDiet(m));return d.length?d:base}
function pick(x,avoid){const p=pool(x);if(!p.length)return -1;let c=p.filter(([,i])=>i!==avoid);if(!c.length)c=p;
 c.sort((a,b)=>macro(b[0]).p/macro(b[0]).k-macro(a[0]).p/macro(a[0]).k);c=c.slice(0,Math.max(3,Math.ceil(c.length*.7)));return c[Math.floor(Math.random()*c.length)][1]}

function mealOut(x){if(S.mode[x]==='b'&&x!=='s')return compose(x);const i=S.picks[x];return i>=0&&i!=null?build(M[i],S.kcal*share(x)):null}

function genDay(used={}){let best=null,bs=1e9;for(let r=0;r<90;r++){const d={};let k=0,p=0,c=0,pen=0;for(const x of types()){const pl=pool(x);if(!pl.length){d[x]=-1;continue}const [m,i]=pl[Math.floor(Math.random()*pl.length)];d[x]=i;const o=build(m,S.kcal*share(x));k+=o.k;p+=o.p;c+=o.c;pen+=(used[i]||0)*.08}
 const sc=Math.abs(k-S.kcal)/S.kcal+1.5*Math.max(0,S.prot-p)/S.prot+(S.diet==='low'?Math.max(0,c-130)/130:0)+pen;if(sc<bs){bs=sc;best=d}}return best}

 const bmi=w/((h/100)**2);let goal=S.goal,under=false;if(goal==='lose'&&bmi<18.5){goal='keep';under=true}
 const def=goal==='lose'?Math.min(750,Math.max(500,tdee*.25)):goal==='gain'?-300:0;let kcal=Math.round((tdee-def)/50)*50;kcal=Math.max(kcal,S.sex==='m'?1500:1200);
 const ref=bmi>27?27*(h/100)**2+.25*(w-27*(h/100)**2):w;return{kcal,ref,bmi,loss:goal==='lose'?(tdee-kcal)*7/7700:0,under,goal}}

asPlan:'زي النظام',dayEdit:'يوم',backupH:'نسخة احتياطية',backupD:'البيانات محفوظة على الجهاز ده بس. انسخ النسخة الاحتياطية واحتفظ بيها، أو الصقها هنا عشان ترجّعها.',

whatAte:'What did you eat?',whatPh:'e.g. 2 liver sandwiches and a soda',howMuch:'How big was it?',sizes:['Less than planned','About as planned','A bit more','A lot more'],orK:'Or type the calories if you know them',saveB:'Save',
logT:'My log',logD:'Every day you log shows how closely you followed the plan. Tap a day to edit it.',goodDays:'On-plan days',streak:'In a row',adh:'Adherence',last28:'Last 4 weeks',

copyB:'Copy backup',restoreB:'Restore from backup',restored:'Data restored',badB:'That backup is not valid',lowNote:'You ate under 70% of your target. Eating far too little leads to hunger and overeating later.',total:'Total'}};
Object.assign(TX.ar,LX.ar);Object.assign(TX.en,LX.en);
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dk(new Date());
function dayStat(key){const L=S.log[key];const m=L&&L.m||{};const xs=Object.keys(m);if(!xs.length)return'empty';const k=xs.reduce((a,x)=>a+(m[x].k||0),0);
 const all=types().every(x=>m[x]);if(k>S.kcal*1.2)return'off';if(all&&k<S.kcal*.7)return'low';
 const clean=xs.every(x=>m[x].st==='ok'||(m[x].st==='other'&&m[x].k<=S.kcal*share(x)*1.2));
 return all&&clean&&Math.abs(k-S.kcal)<=S.kcal*.12?'good':'mid'}
function logSet(key,x,e){S.log[key]=S.log[key]||{m:{}};S.log[key].m=S.log[key].m||{};if(e)S.log[key].m[x]=e;else delete S.log[key].m[x];save()}
function logRow(x){const L=(S.log[today()]||{}).m;const e=L&&L[x];
 if(e)return`<div class="logged"><span>${t('st')[e.st]}${e.name?': '+esc(e.name):''} · ${n(e.k)} ${t('kcal')}</span><button class="btn ghost small" data-unlog="${today()}|${x}">${t('undo')}</button></div>`;
 return`<div class="logrow"><span class="k">${t('logH')}</span><button class="btn ghost small" data-log="${today()}|${x}|ok">${t('ate')}</button><button class="btn ghost small" data-log="${today()}|${x}|other">${t('other')}</button><button class="btn ghost small" data-log="${today()}|${x}|skip">${t('skip')}</button></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function doLog(key,x,st){const K=S.kcal*share(x);
 if(st==='skip')return logSet(key,x,{st,k:0,p:0});
 if(st==='ok'){if(key===today()){const o=mealOut(x);const nm=S.mode[x]==='b'&&x!=='s'?o.items.map(i=>i.name.split(' (')[0]).slice(0,2).join(' + '):mn(M[S.picks[x]]);return logSet(key,x,{st,name:nm,k:Math.round(o.k),p:Math.round(o.p)})}
  return logSet(key,x,{st,name:t('asPlan'),k:Math.round(K),p:Math.round(S.prot*share(x))})}
 openSheet(mlabel(x),`<form id="of" class="form" style="padding:8px 0"><label class="f">${t('whatAte')}<input id="ow" placeholder="${t('whatPh')}"></label>
<div class="f"><b>${t('howMuch')}</b>${seg('osz',t('sizes').map((l,i)=>[l,i]),1)}</div><label class="f">${t('orK')}<input id="ok" inputmode="numeric"></label><button class="btn" type="submit">${t('saveB')}</button></form>`);
 let sz=1;$('#of [data-seg=osz]').addEventListener('click',e=>{const b=e.target.closest('button');if(b){sz=+b.dataset.v}},true);
 $('#of').onsubmit=e=>{e.preventDefault();const kk=digits($('#ok').value);const k=kk>0?kk:Math.round(K*[.6,1,1.4,2][sz]);logSet(key,x,{st:'other',name:$('#ow').value.trim().slice(0,80),k,p:0});closeSheet();rerender()}}
function rerender(){S.view==='log'?logView():S.view==='plan'?plan():0}
function openSheet(title,html){$('#sheetT').textContent=title;$('#closeSheet').textContent=t('close');$('#sheetList').innerHTML=html;$('#sheet').hidden=false;$('#closeSheet').focus()}
function closeSheet(){$('#sheet').hidden=true}
function dayEditor(key){const L=(S.log[key]||{}).m||{};const dt=new Date(key+'T12:00');
 openSheet(t('dayEdit')+' '+dt.toLocaleDateString(AR()?'ar-EG':'en-GB',{weekday:'long',day:'numeric',month:'long'}),types().map(x=>{const e=L[x];
  return`<div class="dayrow"><b>${mlabel(x)}</b>${e?`<p>${t('st')[e.st]}${e.name?': '+esc(e.name):''} · ${n(e.k)} ${t('kcal')}</p>`:''}<div class="acts" style="margin-top:8px"><button class="btn ghost small" data-log="${key}|${x}|ok">${t('asPlan')}</button><button class="btn ghost small" data-log="${key}|${x}|other">${t('other')}</button><button class="btn ghost small" data-log="${key}|${x}|skip">${t('skip')}</button>${e?`<button class="btn ghost small" data-unlog="${key}|${x}">${t('undo')}</button>`:''}</div></div>`}).join('')+`<p class="note">${t('total')}: ${n(Object.values(L).reduce((a,e)=>a+e.k,0))} ${t('kcal')} · ${t('stat')[dayStat(key)]}</p>`)}
function logView(){const days=[...Array(28)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-27+i);return d});
 const logged=Object.keys(S.log).filter(k=>dayStat(k)!=='empty').sort();const good=logged.filter(k=>dayStat(k)==='good');
 let streak=0;for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);const st=dayStat(dk(d));if(st==='good')streak++;else if(i===0&&st==='empty')continue;else break}
 const W=Object.keys(S.log).filter(k=>S.log[k].w).sort().map(k=>[k,S.log[k].w]);const off=logged.filter(k=>dayStat(k)==='off'||Object.values(S.log[k].m||{}).some(e=>e.st!=='ok')).reverse().slice(0,10);
 app.innerHTML=`<section class="band"><div class="wrap">${top()}<button class="btn ghost small" data-go="plan">${t('backDay')}</button><h1 style="margin-top:14px">${t('logT')}</h1><p>${t('logD')}</p>
<div class="kpis"><div><p class="big">${n(good.length)}</p><p>${t('goodDays')}</p></div><div><p class="big">${n(streak)}</p><p>${t('streak')}</p></div><div><p class="big">${logged.length?n(good.length/logged.length*100):'—'}${logged.length?(AR()?'٪':'%'):''}</p><p>${t('adh')}</p></div></div></div></section>
<div class="wrap"><div class="tips"><h2>${t('last28')}</h2><div class="cal">${days.map(d=>{const k=dk(d),st=dayStat(k);return`<button class="${st}${k===today()?' today':''}" data-dayed="${k}" aria-label="${k}: ${t('stat')[st]}">${n(d.getDate())}</button>`}).join('')}</div>
<div class="legend">${['good','mid','off','low','empty'].map(s=>`<span><i class="${s}" style="background:${{good:'var(--leaf)',mid:'#f0b429',off:'var(--tomato)',low:'#8fb3a0',empty:'var(--card)'}[s]}"></i>${t('stat')[s]}</span>`).join('')}</div>
${dayStat(today())==='low'?`<p class="note">${t('lowNote')}</p>`:''}</div>
<div class="tips"><h2>${t('wH')}</h2><form id="wf" class="acts"><input id="wv" inputmode="decimal" aria-label="${t('wL')}" placeholder="${t('wL')}" style="min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);font-size:16px;flex:1"><button class="btn" type="submit">${t('wSave')}</button></form>
${W.length>1?`<p>${t('wChange')(n(W[0][1],1),n(W[W.length-1][1],1))}</p><svg class="spark" id="spark" role="img" aria-label="${t('wH')}"></svg>`:''}</div>
<div class="tips"><h2>${t('mistH')}</h2>${off.length?off.map(k=>{const m=S.log[k].m;return`<button class="opt" data-dayed="${k}"><span><b>${new Date(k+'T12:00').toLocaleDateString(AR()?'ar-EG':'en-GB',{weekday:'short',day:'numeric',month:'short'})}</b><br><span class="hint">${Object.keys(m).filter(x=>m[x].st!=='ok').map(x=>mlabel(x)+': '+(m[x].st==='skip'?t('st').skip:esc(m[x].name||'—'))).join(AR()?'، ':', ')}</span></span><span>${n(Object.values(m).reduce((a,e)=>a+e.k,0))} ${t('kcal')}</span></button>`}).join(''):`<p class="hint">${t('noMist')}</p>`}</div>
<div class="tips"><h2>${t('backupH')}</h2><p class="hint">${t('backupD')}</p><div class="acts"><button class="btn ghost" id="bk">${t('copyB')}</button><button class="btn ghost" id="rs">${t('restoreB')}</button></div><div id="copyBox"></div></div></div>${foot()}`;
 $('#wf').onsubmit=e=>{e.preventDefault();const v=digits($('#wv').value);if(v>=35&&v<=300){S.log[today()]=S.log[today()]||{m:{}};S.log[today()].w=v;save();logView()}};
 const sp=$('#spark');if(sp){const draw=()=>{const Wd=sp.clientWidth,H=sp.clientHeight,vs=W.map(z=>z[1]),mn_=Math.min(...vs)-1,mx=Math.max(...vs)+1;const X=i=>12+i*(Wd-24)/(W.length-1),Y=v=>10+(mx-v)/(mx-mn_)*(H-30);
  sp.innerHTML=`<polyline fill="none" stroke="var(--leaf)" stroke-width="3" points="${W.map((z,i)=>X(i)+','+Y(z[1])).join(' ')}"/>${W.map((z,i)=>`<circle cx="${X(i)}" cy="${Y(z[1])}" r="4" fill="var(--leaf)"/>`).join('')}`};const ro=new ResizeObserver(draw);ro.observe(sp)}}
function go(v){S.view=v;applyTheme();({start,new:formNew,known:formKnown,plan,week,log:logView})[v]();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(b.id==='lang'){S.lang=AR()?'en':'ar';save();return go(S.view)}
 if(b.id==='theme'){const cur=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');S.theme=cur==='dark'?'light':'dark';save();return applyTheme()}
 if(d.go)return go(d.go);
 if(b.parentElement&&b.parentElement.dataset.seg){S[b.parentElement.dataset.seg]=d.v;[...b.parentElement.children].forEach(z=>z.setAttribute('aria-pressed',z===b));return}
 if(d.new){S.picks[d.new]=pick(d.new,S.picks[d.new]);return refresh(d.new)}
 if(d.list)return openList(d.list);
 if(d.pick){const[x,i]=d.pick.split(':');S.picks[x]=+i;S.mode[x]='r';$('#sheet').hidden=true;refresh(x);return $('#m-'+x).scrollIntoView({block:'start',behavior:'smooth'})}
 if(d.mode){const[x,m]=d.mode.split(':');S.mode[x]=m;return refresh(x)}
 if(d.bp){const[x,id]=d.bp.split(':');S.bm[x]={...S.bm[x],p:id};return refresh(x)}
 if(d.bc){const[x,id]=d.bc.split(':');S.bm[x]={...S.bm[x],c:id};return refresh(x)}
 if(d.diet){S.diet=d.diet;setProt();S.week=null;S.bm={};ensure();save();return plan()}
 if(b.id==='closeSheet')return closeSheet();
 if(d.log){const[k,x,st]=d.log.split('|');doLog(k,x,st);if(st!=='other'){if(!$('#sheet').hidden&&S.view==='log')dayEditor(k);else if(!$('#sheet').hidden)dayEditor(k);rerender()}return}
 if(d.unlog){const[k,x]=d.unlog.split('|');logSet(k,x,null);if(!$('#sheet').hidden)dayEditor(k);return rerender()}
 if(d.dayed)return dayEditor(d.dayed);
 if(b.id==='bk')return copy(JSON.stringify({v:2,S}));
 if(b.id==='rs'){openSheet(t('restoreB'),`<form id="rf" class="form" style="padding:8px 0"><textarea id="rt" aria-label="${t('restoreB')}"></textarea><button class="btn" type="submit">${t('restoreB')}</button></form>`);
  $('#rf').onsubmit=e=>{e.preventDefault();try{const j=JSON.parse($('#rt').value);if(!j.S||!j.S.kcal)throw 0;S={...S,...j.S};save();closeSheet();toast(t('restored'));go('log')}catch(x){toast(t('badB'))}};return}
 if(d.ex){S.ex=S.ex.includes(d.ex)?S.ex.filter(z=>z!==d.ex):[...S.ex,d.ex];S.week=null;ensure();save();return plan()}
 if('out' in d){S.out=!S.out;S.week=null;ensure();save();return plan()}
 if(b.id==='all'){S.picks={...S.picks,...genDay()};types().forEach(x=>S.mode[x]='r');save();plan();document.querySelectorAll('.meal').forEach(m=>m.classList.add('fresh'));return}
 if(d.day){S.picks={...S.week[+d.day]};S.mode={};save();return go('plan')}
 if(b.id==='regen'){genWeek();return week()}
 if(d.got){S.got=S.got.includes(d.got)?S.got.filter(z=>z!==d.got):[...S.got,d.got];b.setAttribute('aria-pressed',S.got.includes(d.got));return save()}
 if(b.id==='copy')return copy(dayText());
 if(b.id==='copyShop')return copy(t('shopH')+':\n'+shopList().groups.map(([c,its])=>'\n'+c+':\n'+its.map(z=>'- '+z[1]+': '+z[2]).join('\n')).join('\n'))});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.target.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sheet').hidden=true});
go(S.view);
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
